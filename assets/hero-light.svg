<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">Nguyen Thanh Dat</title>
<desc id="d">Building software with AI, agents and modern engineering workflows.</desc>
<style>
  .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  
  .pulse-dot {
    animation: livePulse 2.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }

  .halo {
    animation: ring 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    transform-origin: center;
  }
  @keyframes ring {
    0% { r: 4px; opacity: 0.8; stroke-width: 1.5px; }
    100% { r: 14px; opacity: 0; stroke-width: 0.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse-dot, .halo { animation: none; }
  }
</style>

<!-- Background Subtle Card Surface -->
<rect x="16" y="16" width="1168" height="388" rx="24" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>

<!-- Top Status Pill (Hark Pro / Apple Dynamic Island Style) -->
<g class="f" transform="translate(600.0, 76)">
  <!-- Pill Background -->
  <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#EFF1F3" stroke="#D8DEE4" stroke-width="1"/>
  
  <!-- Live Signal Indicator -->
  <g transform="translate(-142, 0)">
    <circle class="halo" cx="0" cy="0" r="4" fill="none" stroke="#1A7F37"/>
    <circle class="pulse-dot" cx="0" cy="0" r="4.2" fill="#1A7F37"/>
  </g>
  
  <!-- Pill Label -->
  <text x="-124" y="4" font-size="12" font-weight="500" fill="#424A53" letter-spacing="0.3px">
    SOFTWARE × AI × ENTERPRISE
  </text>
  <text x="142" y="4" text-anchor="end" font-size="11" font-weight="600" fill="#4F46E5" letter-spacing="1px" class="mono">
    DAT-RD
  </text>
</g>

<!-- Main Headline Typography -->
<g class="f" text-anchor="middle">
  <!-- Name -->
  <text x="600.0" y="196" font-size="54" font-weight="700" fill="#1F2328" letter-spacing="-1.2px">
    Nguyen Thanh Dat
  </text>
  
  <!-- Primary Positioning Statement -->
  <text x="600.0" y="254" font-size="22" font-weight="400" fill="#57606A" letter-spacing="-0.3px">
    Building software with AI, agents &amp; modern engineering workflows.
  </text>

  <!-- Secondary Anchor -->
  <text x="600.0" y="294" font-size="15" font-weight="400" fill="#8C959F" letter-spacing="0.2px">
    Exploring the intersection of deterministic enterprise software &amp; autonomous AI systems.
  </text>
</g>

<!-- Bottom Metadata / Architecture Ticks -->
<g class="f mono" font-size="11" fill="#8C959F">
  <text x="48" y="378">SYS.STATUS // ACTIVE</text>
  <text x="600.0" y="378" text-anchor="middle">FPT UNIVERSITY → FPT SOFTWARE → AI SYSTEMS</text>
  <text x="1152" y="378" text-anchor="end">VIETNAM // 2026</text>
</g>

</svg>