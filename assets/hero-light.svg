<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d">
  <title id="t">Nguyen Thanh Dat</title>
  <desc id="d">Building software with AI, agents and modern engineering workflows. Exploring the intersection of software, AI, and enterprise systems.</desc>
  <style>
    .f      { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .name   { font-size: 52px; font-weight: 300; letter-spacing: 7px; fill: #1f2328; }
    .claim  { font-size: 26px; font-weight: 400; fill: #1f2328; }
    .sub    { font-size: 16px; font-weight: 400; fill: #59636e; letter-spacing: 0.3px; }
    .label  { font-size: 11px; font-weight: 500; letter-spacing: 3px; fill: #59636e; }
    .me     { font-size: 11px; font-weight: 600; letter-spacing: 3px; fill: #4f46e5; }
    .line   { stroke: #8c959f; stroke-width: 1; fill: none; }
    .node   { stroke: #59636e; stroke-width: 1.25; fill: none; }
    .core   { fill: #4f46e5; }
    .halo   { fill: #4f46e5; opacity: 0.25; transform-origin: 400px 405px; animation: pulse 4s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.3; } 100% { transform: scale(2.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .halo { animation: none; } }
  </style>

  <g class="f" text-anchor="middle">
    <text class="name"  x="400" y="92">NGUYEN THANH DAT</text>
    <text class="claim" x="400" y="162">Building software with AI, agents &amp;</text>
    <text class="claim" x="400" y="200">modern engineering workflows.</text>
    <text class="sub"   x="400" y="248">Exploring the intersection of software · AI · enterprise systems.</text>
  </g>

  <!-- Conceptual diagram: software branches into AI and enterprise, both converge on the person -->
  <path class="line" d="M400 318 L300 362 L400 405 L500 362 Z"/>
  <circle class="node" cx="400" cy="318" r="3.5"/>
  <circle class="node" cx="300" cy="362" r="3.5"/>
  <circle class="node" cx="500" cy="362" r="3.5"/>
  <circle class="halo" cx="400" cy="405" r="6"/>
  <circle class="core" cx="400" cy="405" r="4.5"/>

  <g class="f">
    <text class="label" x="400" y="302" text-anchor="middle">SOFTWARE</text>
    <text class="label" x="286" y="366" text-anchor="end">AI</text>
    <text class="label" x="514" y="366" text-anchor="start">ENTERPRISE</text>
    <text class="me"    x="400" y="436" text-anchor="middle">DAT</text>
  </g>
</svg>
